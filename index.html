<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surprise for Chinni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Caveat:wght@500;700&family=Manrope:wght@300;500;700&display=swap">

<style>
/* ================= COLORS & FONTS ================= */
:root{
  --night:#120c14; --ink:#f6ece4; --gold:#f2c48d; --rose:#e88aa0; --muted:#a8939f; --paper:#fbf3e6;
  --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.16);
  --display:"Italiana", Georgia, serif;
  --hand:"Caveat", "Segoe Print", cursive;
  --body:"Manrope", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}

/* ---------- background effects ---------- */
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#grain{opacity:.07;mix-blend-mode:overlay;z-index:30}
#dust{z-index:3}
#fly{z-index:11}
#burst{z-index:31}
.leak{position:fixed;inset:-20%;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(40% 35% at 15% 20%,rgba(242,196,141,.45),transparent 70%),
             radial-gradient(35% 30% at 90% 85%,rgba(232,138,160,.35),transparent 70%);
  animation:leak 10s ease-in-out infinite}
@keyframes leak{0%,100%{opacity:.2;transform:translate(0,0)}50%{opacity:.6;transform:translate(4%,-3%)}}
.vignette{position:fixed;inset:0;z-index:29;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(8,5,10,.85) 100%)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;
  opacity:0;pointer-events:none;filter:blur(8px);transition:opacity 1.1s ease,filter 1.1s ease}
.screen.on{opacity:1;pointer-events:auto;filter:none}
.stack{display:grid;gap:18px;justify-items:center;text-align:center;max-width:560px;width:100%}
.eyebrow{font-weight:300;letter-spacing:.45em;text-transform:uppercase;font-size:11px;color:var(--gold)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1}
h1{font-size:clamp(52px,14vw,120px)}
h2{font-size:clamp(34px,8vw,60px)}
.hand{font-family:var(--hand);font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0}
.muted{color:var(--muted);font-size:13px;letter-spacing:.04em;margin:0}
.btn{font:500 15px var(--body);letter-spacing:.06em;color:var(--night);background:linear-gradient(135deg,var(--gold),var(--rose));
  border:0;border-radius:999px;padding:14px 30px;cursor:pointer;box-shadow:0 10px 30px rgba(232,138,160,.25)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.env:focus-visible,.balloon:focus-visible,.gift:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.tapnote{font-family:var(--hand);font-size:26px;color:var(--gold);margin:0;animation:pulseText 1.6s ease-in-out infinite}
@keyframes pulseText{50%{opacity:.35;transform:scale(.96)}}
.fadeBtn{opacity:0;transition:opacity 1s}

/* ---------- 1. cinematic envelope ---------- */
.rays{position:absolute;left:50%;top:58%;width:900px;height:900px;margin:-450px 0 0 -450px;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(242,196,141,.14) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.introTitle{display:grid;gap:6px;justify-items:center;text-align:center;margin-bottom:34px}
.introTitle .w{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(14px);animation:wordIn 1.1s ease forwards}
@keyframes wordIn{to{opacity:1;filter:none;transform:none}}
.introTitle h1{font-size:clamp(58px,17vw,120px);color:var(--ink);text-shadow:0 0 40px rgba(242,196,141,.35)}
.introTitle .hand{color:var(--gold)}
.env{position:relative;display:block;border:0;padding:0;background:none;cursor:pointer;width:min(300px,74vw);aspect-ratio:3/2;perspective:900px;
  opacity:0;animation:envIn 1.6s cubic-bezier(.2,.9,.3,1) 2.6s forwards}
.env-in{position:absolute;inset:0;animation:bob 3.6s ease-in-out 4.2s infinite}
@keyframes envIn{from{opacity:0;transform:translateY(60px) scale(.85) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-10px) rotate(1deg)}}
.env-back{position:absolute;inset:0;background:#b8445f;border-radius:8px;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 60px rgba(232,138,160,.25)}
.env-letter{position:absolute;left:7%;right:7%;top:7%;bottom:6%;z-index:1;background:repeating-linear-gradient(var(--paper) 0 18px,#efdcc4 18px 19px);
  border-radius:4px;display:grid;place-items:center;font:700 26px var(--hand);color:#c0395f;transition:transform 1s cubic-bezier(.3,1.3,.5,1) .55s}
.env-front{position:absolute;inset:0;z-index:2;border-radius:8px;background:linear-gradient(160deg,#ec8aa1,#cf5b78);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-front::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(242,196,141,.55)}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:3;transform-origin:top center;
  background:linear-gradient(180deg,#d96f8a,#b8445f);clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform .7s ease,z-index 0s .35s}
.env-seal{position:absolute;left:50%;top:60%;width:52px;height:52px;margin:-26px 0 0 -26px;z-index:4;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f2c48d,#b8863f 70%);display:grid;place-items:center;color:#6b3a1a;font-size:22px;
  box-shadow:0 6px 14px rgba(0,0,0,.4);transition:transform .4s ease,opacity .4s}
.env.open .env-flap{transform:rotateX(180deg);z-index:0}
.env.open .env-seal{transform:scale(0) rotate(90deg);opacity:0}
.env.open .env-letter{transform:translateY(-38%)}
.env.open{animation:none;opacity:1}
#introTap{margin-top:30px;opacity:0;animation:fadeUp 1s 4.2s forwards,pulseText 1.6s 5.2s infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

/* ---------- 2. password ---------- */
.lockIcon{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);animation:float 3s ease-in-out infinite}
.lockIcon svg{width:38px;height:38px;stroke:var(--gold);fill:none;stroke-width:1.5}
@keyframes float{50%{transform:translateY(-8px)}}
#pw{width:min(300px,100%);background:var(--glass);border:1px solid var(--line);color:var(--ink);border-radius:14px;
  padding:15px 18px;font:500 18px var(--body);letter-spacing:.25em;text-align:center}
#pw::placeholder{letter-spacing:.05em;color:var(--muted)}
#pwMsg{min-height:1.3em;font-family:var(--hand);font-size:24px;color:var(--rose);margin:0}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* ---------- 3. heart balloon ---------- */
.balloon{border:0;background:none;padding:0;cursor:pointer;width:min(230px,58vw);animation:floaty 3.4s ease-in-out infinite}
.balloon svg{width:100%;height:auto;display:block;overflow:visible}
.balloon.grow{animation:grow .35s ease-in forwards}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
@keyframes grow{to{transform:scale(1.18);filter:brightness(1.2)}}
.daysNum{font-family:var(--display);font-size:clamp(64px,18vw,130px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(242,196,141,.35)}

/* ---------- quiz ---------- */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opt{background:var(--glass);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:18px 12px;
  font:500 15px var(--body);cursor:pointer;transition:transform .2s,background .3s,border-color .3s}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opt.no{border-color:var(--rose);opacity:.4}
.opt.yes{background:linear-gradient(135deg,rgba(243,220,107,.35),rgba(242,196,141,.3));border-color:var(--gold)}
#qMsg{min-height:1.3em;margin:0;font-family:var(--hand);font-size:24px;color:var(--rose)}
@media (max-width:380px){.opts{grid-template-columns:1fr}}

/* ---------- scratch card ---------- */
.card{position:relative;width:min(340px,100%);aspect-ratio:4/3;border-radius:20px;overflow:hidden;
  background:linear-gradient(135deg,#2a1a26,#1b1320);border:1px solid var(--line);display:grid;place-items:center;padding:22px}
.card p{font-family:var(--hand);font-size:clamp(24px,6vw,30px);line-height:1.2;margin:0}
.card canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

/* ---------- butterflies ---------- */
.flyText{position:fixed;inset:0;pointer-events:none}
.flyText .top{position:absolute;top:15%;left:20px;right:20px;text-align:center}
.flyText .bottom{position:absolute;bottom:13%;left:20px;right:20px;display:grid;gap:18px;justify-items:center;text-align:center;pointer-events:auto}
.flyText .bottom > *{opacity:0;transition:opacity 1.2s}
.flyText .bottom.in > *{opacity:1}

/* ---------- clouds & trees scene ---------- */
.nature{position:fixed;inset:0;overflow:hidden}
.nature svg{position:absolute;inset:0;width:100%;height:100%}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.bird{animation:birdFly 16s linear infinite}
@keyframes birdFly{from{transform:translate(-60px,0)}to{transform:translate(480px,-80px)}}
.natureText{position:absolute;left:20px;right:20px;top:12%;display:grid;gap:14px;justify-items:center;text-align:center}
.natureText .hand{color:#fff8ef;text-shadow:0 2px 18px rgba(60,20,40,.6);max-width:20ch;font-size:clamp(28px,7vw,42px);opacity:0;animation:wordIn 1.6s ease 1.2s forwards}
.natureText .eyebrow{color:#fff3e2;opacity:0;animation:wordIn 1.2s ease .4s forwards}
.natureBtn{position:absolute;left:0;right:0;bottom:8%;display:grid;justify-items:center}

/* ---------- photo surprises ---------- */
.gift{position:relative;border:0;background:none;padding:0;cursor:pointer;width:min(200px,52vw);aspect-ratio:1;animation:wobble 2.2s ease-in-out infinite}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}85%{transform:rotate(-4deg)}90%{transform:rotate(3deg)}}
.gift .box{position:absolute;left:8%;right:8%;bottom:0;height:62%;border-radius:8px;background:var(--gc);box-shadow:inset 0 -14px 0 rgba(0,0,0,.12),0 24px 50px rgba(0,0,0,.5)}
.gift .lid{position:absolute;left:2%;right:2%;top:24%;height:18%;border-radius:8px;background:var(--gc);filter:brightness(1.12);box-shadow:0 6px 12px rgba(0,0,0,.25);transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .7s}
.gift .rib{position:absolute;left:44%;width:12%;top:24%;bottom:0;background:var(--rc)}
.gift .lid::after{content:"";position:absolute;left:44%;width:12%;top:0;bottom:0;background:var(--rc)}
.gift .bow{position:absolute;left:50%;top:6%;width:50%;height:24%;transform:translateX(-50%);transition:transform .7s,opacity .7s}
.gift .bow::before,.gift .bow::after{content:"";position:absolute;top:10%;width:48%;height:80%;border:7px solid var(--rc);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.gift .bow::before{left:0;transform:rotate(-18deg)}.gift .bow::after{right:0;transform:rotate(18deg)}
.gift.open{animation:none}
.gift.open .lid{transform:translate(30%,-160%) rotate(35deg);opacity:0}
.gift.open .bow{transform:translate(-10%,-260%) rotate(-40deg);opacity:0}
.pview{position:fixed;inset:0;display:grid;align-content:center;justify-items:center;gap:14px;padding:18px 16px 22px;overflow:hidden}
.pview .pbg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(40px) brightness(.4) saturate(1.3);z-index:-1}
.pcard{position:relative;width:min(94vw,520px);height:min(60vh,680px);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12);
  animation:cardIn 1.2s cubic-bezier(.2,.9,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:scale(.8) rotate(-3deg);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.pcard img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.16)}to{transform:scale(1)}}
.pcard .cap{position:absolute;left:0;right:0;bottom:0;padding:50px 18px 14px;background:linear-gradient(transparent,rgba(10,5,10,.85));text-align:left}
.pcard .cap .eyebrow{display:block;margin-bottom:6px}
.pcard .cap h2{font-size:clamp(30px,8vw,46px)}
.plines{display:grid;gap:6px;width:min(94vw,520px);text-align:center}
.plines p{margin:0;font-family:var(--hand);font-size:clamp(22px,5.4vw,30px);line-height:1.15;opacity:0;filter:blur(8px);transform:translateY(8px);transition:opacity 1s,filter 1s,transform 1s}
.plines p.in{opacity:1;filter:none;transform:none}

/* ---------- jigsaw ---------- */
.jig{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(320px,82vw);aspect-ratio:4/5;padding:3px;background:#fbf6ef;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tile{border:0;padding:0;cursor:pointer;background-repeat:no-repeat;transition:transform .25s,filter .25s;outline:3px solid transparent;outline-offset:-3px}
.tile.sel{outline-color:var(--rose);transform:scale(.94);filter:brightness(1.15)}
.jig.done{gap:0;transition:gap .8s}

/* ---------- letter ---------- */
.paper{max-width:min(560px,88vw);font-family:var(--hand);font-size:clamp(23px,3.4vh,32px);line-height:1.35}
.paper span{opacity:0;filter:blur(6px);transition:opacity 1.4s,filter 1.4s}
.paper span.in{opacity:1;filter:none}
.paper .sign{display:block;text-align:right;color:var(--gold);margin-top:18px}

#music{position:fixed;z-index:40;right:14px;top:14px;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;font-size:16px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.leak,.lockIcon,.balloon,.rays,.gift{animation:none}}
</style>
</head>

<body>
<div class="leak"></div>
<canvas id="dust" class="fx"></canvas>
<canvas id="fly" class="fx"></canvas>
<div class="vignette"></div>
<canvas id="grain" class="fx"></canvas>
<canvas id="burst" class="fx"></canvas>
<button id="music" hidden aria-label="Music on or off">♪</button>

<!-- ================= 1. CINEMATIC ENVELOPE ================= -->
<section class="screen on" id="sIntro">
  <div class="rays"></div>
  <div class="stack">
    <div class="introTitle" id="introTitle"></div>
    <button class="env" id="env" aria-label="Open the envelope">
      <span class="env-in">
        <span class="env-back"></span>
        <span class="env-letter" id="envLetter"></span>
        <span class="env-front"></span>
        <span class="env-flap"></span>
        <span class="env-seal">♥</span>
      </span>
    </button>
    <p class="tapnote" id="introTap"></p>
  </div>
</section>

<!-- ================= 2. PASSWORD ================= -->
<section class="screen" id="sLock">
  <form class="stack" id="lockForm" autocomplete="off">
    <div class="lockIcon"><svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="11" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><path d="M12 14.2c-.8-1-2.4-.4-2.2.8.2 1 2.2 2.3 2.2 2.3s2-1.3 2.2-2.3c.2-1.2-1.4-1.8-2.2-.8z"/></svg></div>
    <h2 id="lockTitle"></h2>
    <p class="muted" id="lockHint"></p>
    <input id="pw" type="password" inputmode="numeric" placeholder="enter password" aria-label="Password">
    <button class="btn" type="submit">Open</button>
    <p id="pwMsg" aria-live="polite"></p>
  </form>
</section>

<section class="screen" id="sMain"></section>

<audio id="song" preload="auto" loop></audio>

<script>
/* =====================================================================
   ✏️  EDIT EVERYTHING HERE
   This file sits in the Order6 folder, next to the photos and the song.
   File names must match EXACTLY (spaces and capital letters too).
   ===================================================================== */
const FILM = {
  name: "Chinni",
  from: "yours, always",                          // how the letter is signed

  song: "Order6.mpeg",                            // if there is no sound, rename to Order6.mp3 and change this

  // 1. cinematic envelope
  intro: { title: "Hey Cutie,", line1: "this surprise is for you", line2: "let's open it ♡", letter: "for you ♡", tap: "tap the envelope" },

  // 2. password = her date of birth
  password: "14112001",                           // she can type 14112001 or 14/11/2001
  dob: [2001, 11, 14],                            // year, month, day (for the days counter)
  lockTitle: "Only Chinni can open this",
  hint: "Hint: the day the world got you (DDMMYYYY)",

  // 3. heart balloon
  balloon: { tap: "tap the balloon",
             before: "Since 14 November 2001, the world has had you for",
             after: "days. And I'm grateful for every single one I got to share with you." },

  // 4. food puzzle
  quiz: {
    q: "First, prove it's really you. What is your favourite food in the whole world?",
    options: ["Paneer butter masala", "Lemon rice", "Pizza", "Maggi at 2am"],
    answer: 1,                                    // position of the right answer (starts at 0)
    right: "Lemon rice! Of course. Nobody loves lemon rice the way you do.",
    wrong: ["Nope. You would never betray lemon rice like that.", "Wrong! Think yellow. Think tangy."]
  },

  // 5. scratch card
  scratch: {
    title: "A surprise is hiding here",
    hint: "scratch the gold with your finger",
    message: "You are the kind of person people pray for. And somehow I got you."
  },

  // 6. butterflies spell her name
  butterflies: { top: "for the girl who loves exploring nature", line: "even the butterflies know your name", button: "Next" },

  // 7. clouds & trees, one line for her
  nature: { eyebrow: "for Chinni", line: "Like the clouds and the trees, some things are simply meant to stay. You're one of them.", button: "Open your surprises" },

  // 8. photo surprises (lines appear one by one)
  photos: [
    { src: "order6 image1.jpeg", gift: "#e8607f", title: "That smile",
      lines: ["This is the smile that fixes my worst days.", "You don't even know you're doing it.", "Never stop smiling like this, Chinni."] },
    { src: "order6 image2.jpeg", gift: "#7c6cf0", title: "Main character",
      lines: ["Some people walk into a room.", "You light the whole room up.", "Every frame looks better with you in it."] },
    { src: "order6 image3.jpeg", gift: "#3fa37a", title: "Your happy place",
      lines: ["Trees, hills, fresh air and you.", "This is where you look the happiest.", "I hope life gives you a hundred more places like this."] },
    { src: "order6 image4.jpeg", gift: "#f0a23c", title: "Cute trouble",
      lines: ["A little crazy, a little dramatic,", "and full of the best kind of madness.", "Don't ever change, okay?"] },
    { src: "order6 image5.jpeg", gift: "#d94fa8", title: "My favourite human",
      lines: ["Out of everyone in this world,", "you're the one I'd pick every single time.", "Thank you for being in my life, Chinni."] }
  ],

  // 9. last puzzle (swap pieces)
  jigsaw: {
    title: "Last puzzle",
    hint: "tap two pieces to swap them and fix the picture",
    photo: "order6 image1.jpeg",
    reveal: "Just like this picture, life only makes sense when you're in it."
  },

  // 10. letter and ending
  letter: [
    "Some people come into your life and quietly become home.",
    "You were there on the loud days and on the silent ones.",
    "You laugh at my worst jokes, and you never once let me feel alone.",
    "Thank you for being you, Chinni."
  ],
  ending: { big: "Forever", small: "you, me, and a thousand more memories" },

  timing: { photoLine: 1600, letterLine: 4000 }   // milliseconds
};
/* ===================================================================== */


const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const song = $("#song"), main = $("#sMain");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* intro words appear one by one */
(function(){
  const words = (txt, cls, start, gap) => txt.split(" ").map((w, i) => `<span class="w" style="animation-delay:${start + i * gap}s">${esc(w)}</span>`).join(" ");
  $("#introTitle").innerHTML = `<h1>${words(FILM.intro.title, "", .4, .35)}</h1>
    <p class="hand">${words(FILM.intro.line1, "", 1.2, .18)}</p><p class="hand">${words(FILM.intro.line2, "", 2, .2)}</p>`;
})();
$("#envLetter").textContent = FILM.intro.letter;
$("#introTap").textContent = FILM.intro.tap;
$("#lockTitle").textContent = FILM.lockTitle;
$("#lockHint").textContent = FILM.hint;

/* ---------- photos: preload, placeholder if a file is missing ---------- */
const ready = {};
function placeholder(label){
  const c = document.createElement("canvas"); c.width = 800; c.height = 1000; const g = c.getContext("2d");
  const h = Math.random() * 360, gr = g.createLinearGradient(0, 0, 800, 1000);
  gr.addColorStop(0, `hsl(${h} 55% 62%)`); gr.addColorStop(1, `hsl(${(h + 60) % 360} 45% 30%)`);
  g.fillStyle = gr; g.fillRect(0, 0, 800, 1000);
  g.fillStyle = "rgba(255,255,255,.8)"; g.font = "300 30px Arial"; g.textAlign = "center"; g.fillText(label, 400, 520);
  return c.toDataURL("image/jpeg", .8);
}
function preload(src){
  if (ready[src]) return Promise.resolve(ready[src]);
  return new Promise(res => {

async function butterflies(cfg){

   8. PHOTO SURPRISES — unwrap a gift, big photo, lines one by one
   ===================================================================== */
async function photoSurprise(p, i, total){
  await show(`<div class="stack"><div class="eyebrow">surprise ${i + 1} of ${total}</div>
    <button class="gift" id="gift" style="--gc:${p.gift};--rc:#fbe3b0" aria-label="Open surprise ${i + 1}">
      <span class="box"></span><span class="rib"></span><span class="lid"></span><span class="bow"></span></button>
    <p class="tapnote">tap to unwrap</p></div>`);
  const gift = $("#gift");
  await waitClick(gift);
  gift.classList.add("open"); main.querySelector(".tapnote").style.visibility = "hidden";
  pop(700); const r = gift.getBoundingClientRect(); burst("confetti", r.left + r.width / 2, r.top + r.height * .4);
  await sleep(800);

  const s = ready[p.src] || p.src;
  await show(`<div class="pview"><div class="pbg" style="background-image:url('${s}')"></div>
    <div class="pcard"><img alt="" src="${s}"><div class="cap"><span class="eyebrow">surprise ${i + 1}</span><h2>${esc(p.title)}</h2></div></div>
    <div class="plines">${p.lines.map(l => `<p>${esc(l)}</p>`).join("")}</div>
    <button class="btn fadeBtn" id="go">${i + 1 < total ? "Next surprise" : "Continue"}</button></div>`);
  burst("hearts", innerWidth / 2, innerHeight * .35);
  await sleep(1300);
  for (const line of main.querySelectorAll(".plines p")) { line.classList.add("in"); await sleep(FILM.timing.photoLine); }
  $("#go").style.opacity = 1;
  await waitClick($("#go")); await hide();
}

/* =====================================================================
   9. LAST PUZZLE (swap pieces)
   ===================================================================== */
async function jigsaw(j){
  const src = ready[j.photo] || j.photo;
  await show(`<div class="stack"><div class="eyebrow">${esc(j.title)}</div><div class="jig" id="jig"></div>
    <p class="muted" id="jMsg">${esc(j.hint)}</p></div>`);
  const box = $("#jig"); let order = [...Array(9).keys()], sel = null;
  do { order.sort(() => Math.random() - .5); } while (order.every((v, i) => v === i));
  let resolve; const finished = new Promise(r => resolve = r);
  function draw(){
    box.innerHTML = "";
    order.forEach((piece, pos) => {
      const b = document.createElement("button"); b.className = "tile"; b.setAttribute("aria-label", "piece " + (pos + 1));
      b.style.backgroundImage = `url('${src}')`; b.style.backgroundSize = "300% 300%";
      b.style.backgroundPosition = `${(piece % 3) * 50}% ${Math.floor(piece / 3) * 50}%`;
      if (sel === pos) b.classList.add("sel");
      b.onclick = () => {
        if (sel === null) { sel = pos; draw(); return; }
        [order[sel], order[pos]] = [order[pos], order[sel]]; sel = null; draw();
        if (order.every((v, i) => v === i)) win();
      };
      box.appendChild(b);
    });
  }
  async function win(){
    box.classList.add("done"); box.querySelectorAll("button").forEach(b => b.disabled = true);
    burst("hearts", innerWidth / 2, innerHeight * .45);
    $("#jMsg").outerHTML = `<p class="hand">${esc(j.reveal)}</p><button class="btn" id="go">One last thing</button>`;
    await waitClick($("#go")); resolve();
  }
  draw(); await finished; await hide();
}

/* =====================================================================
   10. LETTER + ENDING
   ===================================================================== */
async function letter(){
  await show(`<div class="paper">${FILM.letter.map(s => `<span>${esc(s)} </span>`).join("<br><br>")}<span class="sign">— ${esc(FILM.from)}</span></div>`);
  for (const s of main.querySelectorAll(".paper span")) { await sleep(400); s.classList.add("in"); await sleep(FILM.timing.letterLine - 400); }
  await sleep(2500); await hide();
}
async function ending(){
  await show(`<div class="stack"><h1>${esc(FILM.ending.big)}</h1><p class="hand">${esc(FILM.ending.small)}</p>
    <div class="eyebrow" style="margin-top:10px">for ${esc(FILM.name)}, with all my heart</div>
    <button class="btn" id="again" style="margin-top:22px">Watch again</button></div>`);
  burst("hearts", innerWidth / 2, innerHeight * .5); setTimeout(() => burst("confetti", innerWidth / 2, innerHeight * .5), 1500);
  setTimeout(() => fade(.25, 6000), 4000);
  await waitClick($("#again")); song.currentTime = 0; fade(.9); await hide(); run(true);
}

/* =====================================================================
   THE ORDER OF EVERYTHING
   ===================================================================== */
async function run(again){
  if (!again) {
    await balloon();
    await quiz(FILM.quiz);
    await scratch(FILM.scratch);
  }
  await butterflies(FILM.butterflies);
  await nature(FILM.nature);
  for (let i = 0; i < FILM.photos.length; i++) await photoSurprise(FILM.photos[i], i, FILM.photos.length);
  if (!again) await jigsaw(FILM.jigsaw);
  await letter();
  await ending();
}

/* =====================================================================
   BACKGROUND: golden dust, film grain, confetti bursts
   ===================================================================== */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const dust = $("#dust"), dg = dust.getContext("2d"), grain = $("#grain"), gg = grain.getContext("2d"), bc = $("#burst"), bg = bc.getContext("2d");
let W, H, DPR = Math.min(2, devicePixelRatio || 1), P = [], BURST = [];
function size(){
  W = innerWidth; H = innerHeight;
  [dust, bc].forEach(c => { c.width = W * DPR; c.height = H * DPR; c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0); });
  grain.width = W / 2; grain.height = H / 2;
  P = Array.from({ length: Math.round(W * H / 14000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .4 + Math.random() * 2.2,
    v: .1 + Math.random() * .35, a: Math.random() * 6.28, h: Math.random() < .7 ? "242,196,141" : "232,138,160" }));
}
size(); addEventListener("resize", size);
function heart(g, x, y, s){
  g.beginPath(); g.moveTo(x, y + s * .3);
  g.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3); g.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
  g.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3); g.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3); g.fill();
}
function burst(kind, x = W / 2, y = H * .55){
  const cols = { hearts:["#e88aa0","#f2c48d","#f6ece4","#c2506c"], lemon:["#f3dc6b","#fff3a8","#9cc59a","#f2c48d"],
                 confetti:["#f2c48d","#e88aa0","#9cc59a","#7fc8ff","#fff3a8"] }[kind] || ["#e88aa0","#f2c48d"];
  for (let i = 0; i < 70; i++) BURST.push({ x, y, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 3,
    s: 8 + Math.random() * 12, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - .5) * .3, k: kind, life: 1 });
}
function fx(){
  dg.clearRect(0, 0, W, H);
  P.forEach(p => { p.y -= p.v; p.a += .01; p.x += Math.sin(p.a) * .3; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    dg.fillStyle = `rgba(${p.h},${.35 + .35 * Math.sin(p.a * 3)})`; dg.beginPath(); dg.arc(p.x, p.y, p.r, 0, 7); dg.fill(); });
  bg.clearRect(0, 0, W, H);
  BURST = BURST.filter(b => b.life > 0);
  BURST.forEach(b => { b.vy += .28; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= .008;
    bg.save(); bg.globalAlpha = Math.max(0, b.life); bg.translate(b.x, b.y); bg.rotate(b.r); bg.fillStyle = b.c;
    if (b.k === "lemon") { bg.beginPath(); bg.arc(0, 0, b.s * .45, 0, 7); bg.fill(); bg.fillStyle = "rgba(255,255,255,.55)"; bg.beginPath(); bg.arc(0, 0, b.s * .25, 0, 7); bg.fill(); }
    else if (b.k === "confetti") bg.fillRect(-b.s * .3, -b.s * .15, b.s * .6, b.s * .3);
    else heart(bg, 0, -b.s / 2, b.s);
    bg.restore(); });
  if (!reduce) {
    const id = gg.createImageData(grain.width, grain.height), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    gg.putImageData(id, 0, 0);
  }
  requestAnimationFrame(fx);
}
fx();
</script>
